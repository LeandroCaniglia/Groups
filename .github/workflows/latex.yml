name: Build and Save LaTeX PDF

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "0-Group Theory.tex" # Change this to the exact name of your main .tex file

      - name: Commit the generated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated PDF compilation"
          file_pattern: "*.pdf"
